name: Native app validation (not PS5 hardware)
on:
  pull_request:
  push:
    branches: [main, 'ci/**']
permissions:
  contents: read
concurrency:
  group: native-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-checks:
    name: Existing model planner and script syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Shell and Python syntax (no submodules needed)
        run: |
          for script in scripts/*.sh ps5/app/ps5cc ps5/app/ps5cxx; do bash -n "$script"; done
          PYTHONPYCACHEPREFIX=build/pycache python3 -m py_compile scripts/*.py
      - name: Build-script job limit and compiler-failure regressions
        run: PYTHONPYCACHEPREFIX=build/pycache python3 -m unittest discover -s tests -p 'test_build_app.py' -v
      - name: Existing synthetic GGUF model-planner regression test
        run: |
          mkdir -p build
          c++ -std=c++17 -O1 ps5/app/model_plan_test.cpp ps5/app/model_plan.cpp -o build/model_plan_test
          build/model_plan_test

  ps5-title:
    name: Full PS5 title cross-build and static package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      # Official Debian image; trixie supplies compatible LLVM19/SPIRV host tools.
      image: debian:trixie-20261020-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
      options: --cpus 2
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_JOBS: '2'
      LLVM_CONFIG: /usr/bin/llvm-config-19
    steps:
      - name: Public cross-build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates wget curl unzip rsync cmake ninja-build \
            clang-19 llvm-19-dev lld-19 libclang-rt-19-dev libclang-19-dev libclang-cpp19-dev \
            libllvmspirvlib-19-dev libclc-19-dev spirv-tools spirv-headers glslang-tools \
            meson pkgconf flex bison python3 python3-mako python3-yaml python3-packaging python3-setuptools \
            zlib1g-dev libzstd-dev libffi-dev libedit-dev libxml2-dev libvulkan-dev glslc ffmpeg xxd
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Pinned llama.cpp and UI sources
        run: |
          # Container root differs from the runner owner. Trust only this checkout,
          # in the disposable job container; never use safe.directory='*'.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1
      - name: Build patched RADV and title, inspect ELF and FSELF
        run: scripts/test-native-build.sh
      - name: State the full-build validation boundary
        if: always()
        run: |
          echo '## Native PS5 title cross-build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Builds the pinned public SDK/runtime, patched RADV, UI and existing app title; checks ELF/FSELF structure.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build tools and checksum-verified public SDK/driver dependencies download; no model or proprietary firmware is needed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is static cross-build validation, not console boot, Vulkan execution, PS5 emulation or model inference.' >> "$GITHUB_STEP_SUMMARY"
